# =============================================================================
# PAPER MANIFEST -- the sessions, settings and folders behind the paper's figures
# =============================================================================
# The scripts in Python/paper_figures/ read THIS file, not session_manifest.yml.
#
# session_manifest.yml (repo root) is the live list: it grows as experiments
# continue, and its settings can change. This file is the frozen counterpart.
# Adding sessions to the live list, or changing a setting there, cannot change
# a paper figure. Edit this file only when the paper itself changes.
#
# It uses the same format as session_manifest.yml, so the ordinary pipeline can
# be run against it:
#     python Python/analysis/prosaccade_population.py --manifest Python/paper_figures/paper_manifest.yml
#
# Figure 5 (Fig5_cortex.py) uses no sessions: its inputs travel with the repo in
# Python/paper_figures/Fig5_inputs/ and it writes next to itself.

# -----------------------------------------------------------------------------
# 1. FOLDERS -- the only lines to change when data or outputs live elsewhere
# -----------------------------------------------------------------------------
# Raw session folders. Every session_path below is relative to this.
data_root: X:\Experimental_Data\EyeHeadCoupling_RatTS_server

# Where the figure scripts save. Each figure's output_dir (section 3) is a
# subfolder of this, unless it is written as a full path.
figures_root: X:\Papers\Active_vision_ts

# Where the pipeline writes per-session results and the Figure 3 population
# cache when it is run with this manifest.
results_root: X:\Papers\Active_vision_ts\Figure3_Saccades
results_with_data: false

# -----------------------------------------------------------------------------
# 2. ANALYSIS SETTINGS -- frozen copies of the defaults the paper was run with
# -----------------------------------------------------------------------------
saccade_config:
  saccade_threshold: 1.0
  saccade_threshold_torsion: 1.5
  blink_threshold: 10.0
  blink_detection: 1

# Prosaccade experiments
reward_contingency:
  reward_angle: 90               # half-width (deg) of the rewarded zone around the target direction
  congruency_window: [0.0, 1.0]   # latency band (s) for the "fraction toward target" summary
  reward_window: 1.1             # default reward window (s)
  scoring_mode: single_shot

# Fixation experiments
max_interval_fixations: 1.0

# Type assumed for a session that does not state one
experiment_type: prosaccade

# -----------------------------------------------------------------------------
# 3. FIGURES -- which sessions each figure uses, and where it saves
# -----------------------------------------------------------------------------
# example_session / sessions / cued_sessions name entries from section 4.
# population names an experiment_type: the figure pools EVERY session of that
# type listed in section 4, so adding or removing one there changes the figure.
figures:
  Fig3:
    output_dir: Figure3_Saccades
    example_session: Tsh002_2026-08-19T12_49_59   # panels B and C
    population: prosaccade                        # panel D and the per-animal supplement

  Fig3S:                                          # torsion panels of Fig. S3 (C and D)
    sessions:                                     # "Session 1", then "Session 2"
      - Tsh001_2025-07-18T14_57_23
      - Tsh001_2025-07-17T15_32_42
    # No output_dir: this script saves into <results_root>/<session>/torsion/.

  Fig4:
    output_dir: Figure4_Fixation
    cued_sessions:                                # panels B and C: top row, then bottom row
      - Tsh002_2025-09-05T10_59_22
      - Tsh002_2025-09-15T11_41_54
    example_session: Tsh001_2025-11-24T14_28_34   # panels E and F
    population: fixation_on_target                # panel G

  Fig4S:
    output_dir: X:\Analysis\EyeHeadCoupling\Fig4S_fixation_heatmap
    sessions:                                     # one row of heatmaps each, top to bottom
      - Tsh001_2026-01-13T13_26_58
      - Tsh001_2026-01-13T13_00_15
      - Tsh001_2026-01-13T13_13_35

